<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071827">
  <title>Loading…</title>
  <style id="base-style">
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    :root{color-scheme:dark;--page-glow:#0d243d;--ink:#edf5ff;--muted:#a6bbd4;--line:rgba(155,191,230,.18);--accent:#7ec4ff;--accent-soft:rgba(126,196,255,.16);--shadow:rgba(2,6,14,.56)}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;color:var(--ink);font-family:"DM Sans",sans-serif;
      background:radial-gradient(ellipse at 50% 0%,var(--page-glow),transparent 58%),repeating-linear-gradient(135deg,transparent 0 22px,rgba(148,185,255,.03) 22px 23px),linear-gradient(180deg,#091d2d 0%,#050f1a 100%)}
    .state{width:min(100%,470px);padding:40px 32px;text-align:center;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(14,30,47,.98),rgba(9,21,34,.98));box-shadow:0 24px 80px var(--shadow),inset 0 1px 0 rgba(255,255,255,.04)}
    .state__badge{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
    .state__dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
    .state h1{margin:18px 0 0;font-family:"Playfair Display",Georgia,serif;font-size:clamp(30px,9vw,40px);font-weight:600;line-height:1.12}
    .state h1 span{color:var(--accent)}
    .state p{max-width:300px;margin:13px auto 0;color:var(--muted);font-size:14px;line-height:1.7}
    .spinner{width:28px;height:28px;margin:22px auto 0;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-color-scheme:light){
      :root{color-scheme:light;--page-glow:#edf6ff;--ink:#11263c;--muted:#5f7590;--line:rgba(98,136,176,.22);--accent:#2d74b8;--accent-soft:rgba(41,116,184,.12);--shadow:rgba(15,35,58,.12)}
      body{background:radial-gradient(ellipse at 50% 0%,var(--page-glow),transparent 58%),repeating-linear-gradient(135deg,transparent 0 22px,rgba(54,104,168,.04) 22px 23px),linear-gradient(180deg,#edf5ff 0%,#e2ebf8 100%)}
      .state{background:linear-gradient(180deg,#fdfefe,#f1f7ff)}
    }
    @media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}
  </style>
  <style id="tag-style"></style>
</head>
<body>
  <div id="app" style="display:contents">
    <section class="state">
      <span class="state__badge"><span class="state__dot"></span> Reading tag</span>
      <div class="spinner" role="status" aria-label="Loading"></div>
    </section>
  </div>
  <script>
    const app = document.getElementById("app");
    const showState = (badge, title, text) => {
      app.innerHTML = "";
      const s = document.createElement("section");
      s.className = "state";
      s.innerHTML = '<span class="state__badge"><span class="state__dot"></span></span><h1></h1><p></p>';
      s.querySelector(".state__badge").append(" " + badge);
      s.querySelector("h1").append(title, Object.assign(document.createElement("span"), {textContent: "."}));
      s.querySelector("p").textContent = text;
      app.append(s);
    };
    const id = new URLSearchParams(location.search).get("id");
    fetch("data.json")
      .then(r => r.json())
      .then(db => {
        const item = id && Object.prototype.hasOwnProperty.call(db, id) ? db[id] : null;
        if (!item) { document.title = "Tag not recognized"; showState("Unknown tag", "Tag not recognized", "This tag isn't linked to a page yet. Check the link and try tapping again."); return; }
        document.title = item.title || "";
        document.getElementById("tag-style").textContent = item.css || "";
        app.innerHTML = item.html || "";
      })
      .catch(() => showState("Error", "Something went wrong", "The tag data couldn't be loaded. Please try again in a moment."));
  </script>
</body>
</html>
